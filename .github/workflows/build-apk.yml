name: Build CHOWKI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        run: |
          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::Missing settings.gradle"
            exit 1
          fi

          if [ ! -f gradlew ] && [ ! -f gradlew.bat ]; then
            echo "No Gradle wrapper found. Checking installed Gradle."
          fi

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "::error::Android app module not found. The Android files must be placed in the correct project folders."
            exit 1
          fi

      - name: Upload CHOWKI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CHOWKI-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
